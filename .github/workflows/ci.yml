name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python }}

      - name: Install project (editable, with dev extras)
        run: uv pip install --system -e ".[dev]"

      - name: Run tests
        run: uv run --with pytest pytest -m "not slow" -q

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project
        run: uv pip install --system -e ".[dev]"

      - name: Set up Node (for npx)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run slow e2e tests
        run: uv run --with pytest pytest -m slow -q
