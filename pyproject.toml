[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shugo"
version = "0.1.0"
description = "Minimal MCP guardrails proxy — policy-first, human approvals, hash-chained audit log."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "aritraghosh01" }]
keywords = ["mcp", "guardrails", "ai-safety", "agent", "policy", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.28,<2",
    "typer>=0.12",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "rich>=13.7",
    "inputimeout>=1.0.4",
    "aiohttp>=3.9",
]

[project.urls]
Homepage = "https://github.com/aritraghosh01/shugo"
Repository = "https://github.com/aritraghosh01/shugo"
Issues = "https://github.com/aritraghosh01/shugo/issues"

[project.scripts]
shugo = "shugo.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-aiohttp>=1.0",
    "pytest-cov>=5.0",
    "anyio>=4.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shugo"]

[tool.hatch.build.targets.wheel.force-include]
"src/shugo/evidence/mappings" = "shugo/evidence/mappings"

[tool.hatch.build.targets.sdist]
include = ["src/shugo", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: end-to-end tests requiring external processes (npx, etc.)",
]
